# Per-service posture controls for the exact none/selected/full contract.
#
# Every OTEL_CANDIDATE_* variable is supplied by candidate_runtime.posture_environment
# (plan side) and candidate_setup.compose_environment (install side); ``:?`` fails
# closed when a variable is unset or empty, ``?`` fails closed only when unset so
# that the agent-clearing variables may legitimately be the empty string.
#
# Services whose upstream image loads an instrumentation agent unconditionally
# get a posture-conditional launch here (materialize.py ENTRYPOINT_GUARDS /
# AGENT_ENVIRONMENT are the single render source; candidate_runtime.py declares
# the expected values independently and compares). ``$$`` is Compose's escape
# for a literal ``$`` that the container shell, not Compose, must expand.
services:
  accountingservice:
    entrypoint:
      - /bin/sh
      - -c
      - 'if [ "$$OTEL_PLACEMENT_ENABLED" = "false" ]; then exec dotnet AccountingService.dll; else exec ./instrument.sh dotnet AccountingService.dll; fi'
    environment:
      OTEL_PLACEMENT_ENABLED: "${OTEL_CANDIDATE_ACCOUNTINGSERVICE_ENABLED:?candidate posture required}"
      OTEL_SDK_DISABLED: "${OTEL_CANDIDATE_ACCOUNTINGSERVICE_DISABLED:?candidate posture required}"
      OTEL_TRACES_EXPORTER: "${OTEL_CANDIDATE_ACCOUNTINGSERVICE_EXPORTER:?candidate posture required}"
      OTEL_METRICS_EXPORTER: "${OTEL_CANDIDATE_ACCOUNTINGSERVICE_EXPORTER:?candidate posture required}"
      OTEL_LOGS_EXPORTER: "${OTEL_CANDIDATE_ACCOUNTINGSERVICE_EXPORTER:?candidate posture required}"
  adservice:
    environment:
      JAVA_TOOL_OPTIONS: "${OTEL_CANDIDATE_ADSERVICE_JAVA_TOOL_OPTIONS?candidate posture required}"
