services:
  consul:
    image: ${HR_CONSUL_IMAGE:-hashicorp/consul:1.13}
  frontend:
    image: ${HR_APP_IMAGE:-obsplacement-hotel-reservation:6ecb09706140}
    build:
      labels:
        org.obsplacement.materialized-source-sha256: ${HR_SOURCE_SHA256:?set HR_SOURCE_SHA256}
    environment:
      JAEGER_SAMPLE_RATIO: ${HR_FRONTEND_JAEGER_SAMPLE_RATIO:?set HR_FRONTEND_JAEGER_SAMPLE_RATIO}
      JAEGER_DISABLED: ${HR_FRONTEND_JAEGER_DISABLED:?set HR_FRONTEND_JAEGER_DISABLED}
  search:
    image: ${HR_APP_IMAGE:-obsplacement-hotel-reservation:6ecb09706140}
    environment:
      JAEGER_SAMPLE_RATIO: ${HR_JAEGER_SAMPLE_RATIO:-1}
      JAEGER_DISABLED: ${HR_JAEGER_DISABLED:-false}
  geo:
    image: ${HR_APP_IMAGE:-obsplacement-hotel-reservation:6ecb09706140}
    environment:
      JAEGER_SAMPLE_RATIO: ${HR_JAEGER_SAMPLE_RATIO:-1}
      JAEGER_DISABLED: ${HR_JAEGER_DISABLED:-false}
  rate:
    image: ${HR_APP_IMAGE:-obsplacement-hotel-reservation:6ecb09706140}
