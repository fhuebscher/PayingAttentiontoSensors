      JAEGER_DISABLED: ${HR_JAEGER_DISABLED:-false}
  recommendation:
    image: ${HR_APP_IMAGE:-obsplacement-hotel-reservation:6ecb09706140}
    environment:
      JAEGER_SAMPLE_RATIO: ${HR_JAEGER_SAMPLE_RATIO:-1}
