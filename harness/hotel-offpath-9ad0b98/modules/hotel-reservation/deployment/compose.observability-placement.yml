    image: ${HR_JAEGER_IMAGE:-jaegertracing/all-in-one:1.60}
  memcached-rate:
    image: ${HR_MEMCACHED_IMAGE:-memcached:1.6.24}
  memcached-review:
    image: ${HR_MEMCACHED_IMAGE:-memcached:1.6.24}
