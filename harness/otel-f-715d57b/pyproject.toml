[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "goal-conditioned-observability-placement"
version = "0.1.0"
description = "Discovery, compilation, and validation of realizable observability configurations"
requires-python = ">=3.13,<3.14"
dependencies = [
  "jsonschema==4.25.1",
  "pika==1.4.2",
  "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
  "pytest==8.4.2",
]
tracking = [
  "mlflow==3.5.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/obsplacement"]
